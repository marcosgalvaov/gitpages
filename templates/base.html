<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} {% endblock %}</title>
    <link rel="stylesheet" href="../static/style.css">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    
</head>
<body>
    <main>
    <header id="topo" class="cabecalho">
        
        <figure style="margin: 1% 0 1% 5%">
            <img src="{{ url_for('static', filename='img/logo tiny thali.png') }}" alt="Logo">

        </figure>
        <nav style="margin-right: 5%">
            <a href="/"; class="btn" style="color:#8a868b">Home</a>
            <a href="/produtos"; class="btn" style="color:#8a868b">Produtos</a>
            <a href="/sobre"; class="btn" style="color:#8a868b">Sobre</a>
            <a href="/contato"; class="btn" style="color:#8a868b">Contato</a>
        </nav>

        <div class="dropdown">
            <button type="button" class="btn btn-dark dropdown-toggle" data-bs-toggle="dropdown">Menu</button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="/">Home</a></li>
                <li><a class="dropdown-item" href="/produtos">Produtos</a></li>
                <li><a class="dropdown-item" href="/sobre">Sobre</a></li>
                <li><a class="dropdown-item" href="/contato">Contato</a></li>
            </ul>
        </div>
    </header>

{% block main %}
    
{% endblock %}

    <footer>
        <p>@ 2026 Tiny Thali - Todos os direitos reservados</p> 
        <p>Marcos Guilherme Galvão Vilas Boas - Prática 6 </p>
    </footer>

</main>
</body>
</html>
