<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny Thali</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
</head>
<body>
    <header class="cabecalho">
        
        <figure>
            <img src="./logo tiny thali.png" alt="Logo">

        </figure>
        <nav style="margin-right: 5%">
            <a href="index.html"; style="color: #8a868b">Home</a>
            <a href="sobre.html"; style="color: #8a868b">Sobre</a>
            <a href="contatos.html"; style="color: #c663e2">Contato</a>
        </nav>
    </header>
    <main>
        <section>
            <div class="banner">
                <h1>FAÇA AGORA O SEU PEDIDO</h1>
                <h2>Entre em contato</h2>
            </div>
        </section>

        <section class="contatos">
            <div>
            <form>
                <h1 style="font-weight: bold">Envie sua mensagem</h1>
                <h2></h2>
                <label for="nome">Seu nome:</label><br>
                <input type="text" id="nome" name="nome"><br>
                <label for="email">Seu e-mail:</label><br>
                <input type="text" id="email" name="email"><br>
                <label for="telefone">Seu telefone:</label><br>
                <input type="text" id="telefone" name="telefone"><br>
                <label for="desc">Descrição do pedido:</label><br>
                <input type="text" id="desc" name="desc"><br>
                <input type="submit" value="Enviar">

            </form>
            </div>

            <div id="outroscontatos">
                <h2 style="font-weight: bold">Outros canais</h2>
                <h3></h3>
                <h1>♡ E-MAIL:</h1>
                <p>tinythaliloja@gmail.com</p>

                <h1>♡ INSTAGRAM:</h1>
                <p>@tinythali</p>
            </div>
        </section>

        <footer>
            <p>@ 2026 Tiny Thali - Todos os direitos reservados</p>
        </footer>

    </main>
</body>
</html>
